name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          ini-values: phar.readonly=0
          tools: composer:v2

      - name: Download box
        run: |
          curl -L https://github.com/box-project/box/releases/latest/download/box.phar -o box.phar
          chmod +x box.phar

      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build PHAR
        run: php box.phar compile

      - name: Smoke test PHAR
        run: |
          php tq.phar list-types
          php tq.phar --version
          ! php tq.phar var/test-examples/

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build \
            -t ghcr.io/jorjives/php-test-quality:"$VERSION" \
            -t ghcr.io/jorjives/php-test-quality:latest \
            .
          docker push ghcr.io/jorjives/php-test-quality:"$VERSION"
          docker push ghcr.io/jorjives/php-test-quality:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: tq.phar
          generate_release_notes: true
