version: 2
updates:
  # The image bundles PHP, so a patch bump here ships a security fix on merge.
  # Moving to a new PHP minor is left as a deliberate change.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: php
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ["*"]

  # Workflow changes don't affect the PHAR or image, so skip the auto-release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "release:skip"]
